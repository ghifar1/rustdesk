apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustdesk.fullname" . }}
  labels:
    {{- include "rustdesk.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rustdesk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustdesk.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "rustdesk.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- $hbbsCommand := default (list) .Values.hbbs.command }}
        {{- if eq (len $hbbsCommand) 0 }}
        {{- $hbbsCommand = list "hbbs" }}
        {{- end }}
        {{- $hbbsArgs := list }}
        {{- $relayAddress := include "rustdesk.relayAddress" . }}
        {{- if $relayAddress }}
        {{- $hbbsArgs = append $hbbsArgs "-r" }}
        {{- $hbbsArgs = append $hbbsArgs $relayAddress }}
        {{- end }}
        {{- if .Values.server.encryptedOnly }}
        {{- $hbbsArgs = append $hbbsArgs "-k" }}
        {{- $hbbsArgs = append $hbbsArgs "_" }}
        {{- end }}
        {{- $hbbsUserArgs := default (list) .Values.hbbs.args }}
        {{- if gt (len $hbbsUserArgs) 0 }}
        {{- $hbbsArgs = concat $hbbsArgs $hbbsUserArgs }}
        {{- end }}
        - name: hbbs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /data
          command:
            {{- toYaml $hbbsCommand | nindent 12 }}
          {{- if gt (len $hbbsArgs) 0 }}
          args:
            {{- toYaml $hbbsArgs | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- range $index, $port := .Values.services.hbbs.ports }}
            {{- $containerPort := $port.containerPort | default $port.targetPort | default $port.port }}
            - name: {{ $port.name | default (printf "hbbs-%d" $index) }}
              containerPort: {{ $containerPort }}
              protocol: {{ $port.protocol | default "TCP" }}
            {{- end }}
            {{- if and .Values.udpService.enabled .Values.udpService.port }}
            - name: {{ .Values.udpService.name | default "hbbs-udp" }}
              containerPort: {{ .Values.udpService.targetPort | default .Values.udpService.port }}
              protocol: UDP
            {{- end }}
          {{- $hbbsEnvGlobal := default (list) .Values.env }}
          {{- $hbbsEnvLocal := default (list) .Values.hbbs.env }}
          {{- if or (gt (len $hbbsEnvGlobal) 0) (gt (len $hbbsEnvLocal) 0) }}
          env:
            {{- if gt (len $hbbsEnvGlobal) 0 }}
            {{- toYaml $hbbsEnvGlobal | nindent 12 }}
            {{- end }}
            {{- if gt (len $hbbsEnvLocal) 0 }}
            {{- toYaml $hbbsEnvLocal | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.hbbs.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.hbbs.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.hbbs.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.hbbs.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.hbbs.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.hbbs.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.persistence.enabled .Values.config.enabled (gt (len .Values.extraVolumeMounts) 0) }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.config.enabled }}
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- $hbbrCommand := default (list) .Values.hbbr.command }}
        {{- if eq (len $hbbrCommand) 0 }}
        {{- $hbbrCommand = list "hbbr" }}
        {{- end }}
        {{- $hbbrArgs := list }}
        {{- if .Values.server.encryptedOnly }}
        {{- $hbbrArgs = append $hbbrArgs "-k" }}
        {{- $hbbrArgs = append $hbbrArgs "_" }}
        {{- end }}
        {{- $hbbrUserArgs := default (list) .Values.hbbr.args }}
        {{- if gt (len $hbbrUserArgs) 0 }}
        {{- $hbbrArgs = concat $hbbrArgs $hbbrUserArgs }}
        {{- end }}
        - name: hbbr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /data
          command:
            {{- toYaml $hbbrCommand | nindent 12 }}
          {{- if gt (len $hbbrArgs) 0 }}
          args:
            {{- toYaml $hbbrArgs | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- range $index, $port := .Values.services.hbbr.ports }}
            {{- $containerPort := $port.containerPort | default $port.targetPort | default $port.port }}
            - name: {{ $port.name | default (printf "hbbr-%d" $index) }}
              containerPort: {{ $containerPort }}
              protocol: {{ $port.protocol | default "TCP" }}
            {{- end }}
          {{- $hbbrEnvGlobal := default (list) .Values.env }}
          {{- $hbbrEnvLocal := default (list) .Values.hbbr.env }}
          {{- if or (gt (len $hbbrEnvGlobal) 0) (gt (len $hbbrEnvLocal) 0) }}
          env:
            {{- if gt (len $hbbrEnvGlobal) 0 }}
            {{- toYaml $hbbrEnvGlobal | nindent 12 }}
            {{- end }}
            {{- if gt (len $hbbrEnvLocal) 0 }}
            {{- toYaml $hbbrEnvLocal | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.hbbr.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.hbbr.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.hbbr.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.hbbr.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.hbbr.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.hbbr.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.persistence.enabled .Values.config.enabled (gt (len .Values.extraVolumeMounts) 0) }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.config.enabled }}
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "rustdesk.fullname" . }}-data
          {{- end }}
        {{- end }}
        {{- if .Values.config.enabled }}
        - name: config
          configMap:
            name: {{ include "rustdesk.fullname" . }}-config
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
